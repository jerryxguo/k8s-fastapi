{{- if .Values.externalSecret.enabled }}
# Requires the External Secrets Operator to be installed cluster-wide (see
# infra/k8s/README.md) and its ServiceAccount bound to the
# external_secrets_irsa_role_arn Terraform output via IRSA. The secret sync
# happens out-of-band; the app just reads plain environment variables, same
# as ConfigMap-sourced config.
#
# apiVersion pinned to v1, not v1beta1: External Secrets Operator promoted
# ExternalSecret (along with ClusterSecretStore, SecretStore) to
# external-secrets.io/v1 -- v1beta1 is no longer served by the CRD this
# chart version installs. Confirmed against a live cluster via
# `kubectl api-resources | grep external-secrets` (see
# infra/terraform/live/<env>/main.tf's cluster_secret_store resource, which
# hit the identical "no matches for kind ... in version ... v1beta1" error
# for the same reason).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "fastapi-service.fullname" . }}-secret
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "fastapi-service.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: {{ include "fastapi-service.fullname" . }}-secret
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: {{ .Values.externalSecret.secretsManagerName | quote }}
{{- end }}
