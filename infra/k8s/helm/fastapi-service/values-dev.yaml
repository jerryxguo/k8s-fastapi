namespace: k8s-demo

replicaCount: 1

autoscaling:
  minReplicas: 1
  maxReplicas: 3

env:
  APP_ENV: "development"
  APP_NAME_PREFIX: "k8s-demo-dev"

externalSecret:
  secretsManagerName: "k8s-demo-dev/app-config"

ingress:
  scheme: internal
  host: "k8s-demo.dev.internal.example.com"
  # Set to the ACM certificate ARN covering the host above to switch
  # this environment from HTTP to HTTPS (with an HTTP->HTTPS redirect).
  # certificateArn: "arn:aws:acm:ap-southeast-2:<account>:certificate/<id>"
