{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "fastapi-service.fullname" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "fastapi-service.labels" . | nindent 4 }}
  {{- if .Values.serviceAccount.roleArn }}
  annotations:
    # IRSA: binds this ServiceAccount to the IAM role Terraform created via
    # the irsa-role module (app_irsa_role_arn output), so pods running under
    # this ServiceAccount can assume that role's AWS permissions.
    eks.amazonaws.com/role-arn: {{ .Values.serviceAccount.roleArn }}
  {{- end }}
{{- end }}
