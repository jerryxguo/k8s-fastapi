{{- if .Values.externalSecret.enabled }}
# Requires the External Secrets Operator to be installed cluster-wide (see
# infra/k8s/README.md) and its ServiceAccount bound to the
# external_secrets_irsa_role_arn Terraform output via IRSA. The secret sync
# happens out-of-band; the app just reads plain environment variables, same
# as ConfigMap-sourced config.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "fastapi-service.fullname" . }}-secret
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "fastapi-service.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: {{ include "fastapi-service.fullname" . }}-secret
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: {{ .Values.externalSecret.secretsManagerName | quote }}
{{- end }}
