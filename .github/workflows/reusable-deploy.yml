name: reusable-deploy

# The actual deploy mechanism: a single `helm upgrade --install`, gated by
# a GitHub Environment (development/production) for approval rules and
# environment-scoped secrets/variables.

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      image:
        description: "Full image ref (repo:tag) to deploy, e.g. from reusable-build-and-push's output"
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name "${{ vars.EKS_CLUSTER_NAME }}" --region "${{ vars.AWS_REGION }}"

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.1

      - name: Split image ref
        id: image
        run: |
          IMAGE_REPO="${IMAGE_REF%:*}"
          IMAGE_TAG="${IMAGE_REF##*:}"
          echo "repo=${IMAGE_REPO}" >> "$GITHUB_OUTPUT"
          echo "tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
        env:
          IMAGE_REF: ${{ inputs.image }}

      - name: helm upgrade --install
        run: |
          helm upgrade --install k8s-demo-service \
            infra/k8s/helm/fastapi-service \
            --namespace "${{ vars.APP_NAMESPACE || 'k8s-demo' }}" \
            --create-namespace \
            -f "infra/k8s/helm/fastapi-service/values.yaml" \
            -f "infra/k8s/helm/fastapi-service/values-${{ vars.ENVIRONMENT_SHORT }}.yaml" \
            --set image.repository="${{ steps.image.outputs.repo }}" \
            --set image.tag="${{ steps.image.outputs.tag }}" \
            --set serviceAccount.roleArn="${{ vars.APP_IRSA_ROLE_ARN }}" \
            --set externalSecret.enabled=false \
            --wait --timeout 5m

      - name: Verify rollout
        run: |
          kubectl -n "${{ vars.APP_NAMESPACE || 'k8s-demo' }}" rollout status deploy/k8s-demo-service --timeout=120s
