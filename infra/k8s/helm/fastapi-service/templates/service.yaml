apiVersion: v1
kind: Service
metadata:
  name: {{ include "fastapi-service.fullname" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "fastapi-service.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "fastapi-service.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
