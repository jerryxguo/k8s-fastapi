{{- if .Values.externalSecret.enabled }}
# Needs the External Secrets Operator, installed by Terraform. Sync happens
# out-of-band; the app just reads environment variables.
#
# apiVersion v1, not v1beta1 -- the latter is no longer served and fails as if
# the CRD were missing.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "fastapi-service.fullname" . }}-secret
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "fastapi-service.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: {{ include "fastapi-service.fullname" . }}-secret
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: {{ .Values.externalSecret.secretsManagerName | quote }}
{{- end }}
