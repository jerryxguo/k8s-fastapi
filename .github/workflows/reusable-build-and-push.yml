name: reusable-build-and-push

# Builds the Docker image via Pants (`pants package src/app:docker`) and
# pushes it to the shared ECR repo owned by the dedicated "shared" AWS
# account (see infra/terraform/live/shared). Assumes that account's CI/CD
# IAM role directly via GitHub OIDC (`aws-actions/configure-aws-credentials`)
# -- no role-chaining and no external repo's reusable workflow; everything
# this job needs lives in this repository.

on:
  workflow_call:
    outputs:
      version:
        description: "Generated build version, e.g. v2026-08-15.123456789"
        value: ${{ jobs.build.outputs.version }}
      image:
        description: "Full image ref that was pushed"
        value: ${{ jobs.build.outputs.image }}

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    environment: shared # the "shared" account owns the ECR repo -- see infra/terraform/live/shared
    outputs:
      version: ${{ steps.version.outputs.version }}
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/bootstrap-pants

      - id: version
        uses: ./.github/actions/generate-build-version

      - name: Build image (pants package src/app:docker)
        env:
          BUILD_VERSION: ${{ steps.version.outputs.version }}
        run: pants package src/app:docker

      # Before configure-aws-credentials: an unset vars.* renders as an omitted
      # line in the printed `with:` block, so the action fails with "Input
      # required and not supplied: aws-region" and nothing points at the
      # Environment. ECR_REPOSITORY is checked here too -- empty, it makes the
      # push step run `docker tag ... ":<version>"`.
      - name: Check this Environment is configured
        env:
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
          AWS_REGION_VAR: ${{ vars.AWS_REGION }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
        run: |
          set -euo pipefail
          missing=""
          [ -n "${AWS_ROLE_ARN}" ]    || missing="${missing} AWS_ROLE_ARN"
          [ -n "${AWS_REGION_VAR}" ]  || missing="${missing} AWS_REGION"
          [ -n "${ECR_REPOSITORY}" ]  || missing="${missing} ECR_REPOSITORY"
          if [ -n "${missing}" ]; then
            echo "::error::Missing variable(s) on the 'shared' GitHub Environment:${missing}"
            echo "Set them as Environment *variables* (not secrets) under"
            echo "Settings -> Environments -> shared. Values come from"
            echo "'terraform output' in infra/terraform/live/shared."
            exit 1
          fi

      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2
        id: ecr-login

      - name: Tag and push image
        id: image
        env:
          BUILD_VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Only the versioned tag is pushed -- the ECR repo has
          # image_tag_mutability = "IMMUTABLE" (see
          # infra/terraform/modules/ecr-repo/main.tf), which is deliberate:
          # it stops a tag from being silently swapped out from under a
          # deployment. A ":latest" tag is fundamentally incompatible with
          # that -- it can only ever be pushed once, then every subsequent
          # build fails with "tag invalid: ... cannot be overwritten
          # because the tag is immutable". Nothing downstream needs
          # ":latest" anyway: reusable-deploy.yml deploys this step's
          # versioned `image` output directly.
          LOCAL_IMAGE="k8s-demo-shared/service-api:${BUILD_VERSION}"
          docker tag "$LOCAL_IMAGE" "${{ vars.ECR_REPOSITORY }}:${BUILD_VERSION}"
          docker push "${{ vars.ECR_REPOSITORY }}:${BUILD_VERSION}"
          echo "image=${{ vars.ECR_REPOSITORY }}:${BUILD_VERSION}" >> "$GITHUB_OUTPUT"
