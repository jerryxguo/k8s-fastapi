namespace: k8s-demo

replicaCount: 3

autoscaling:
  minReplicas: 3
  maxReplicas: 8

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: "2"
    memory: 2Gi

env:
  APP_ENV: "production"
  APP_NAME_PREFIX: "k8s-demo-prod"
  # Celery on ElastiCache Redis (module.redis in infra/terraform/live/prod).
  # APP_REDIS_URL comes from externalSecret.redisSecretName below; pods fail
  # settings validation at startup without it.
  APP_QUEUE_BACKEND: "redis"

worker:
  replicaCount: 2

externalSecret:
  secretsManagerName: "k8s-demo-prod/app-config"
  redisSecretName: "k8s-demo-prod/redis"

ingress:
  scheme: internal
  host: "k8s-demo.apis.example.com"
  # Set to the ACM certificate ARN covering the host above to switch
  # this environment from HTTP to HTTPS (with an HTTP->HTTPS redirect).
  # certificateArn: "arn:aws:acm:ap-southeast-2:<account>:certificate/<id>"
