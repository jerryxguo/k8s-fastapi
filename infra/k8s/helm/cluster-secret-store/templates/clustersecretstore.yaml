# apiVersion v1, not v1beta1 -- the latter is no longer served and fails as if
# the CRD were missing.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: {{ .Values.name }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ required "cluster-secret-store: .Values.region is required" .Values.region | quote }}
      auth:
        # IRSA via the projected service-account token, no static credentials.
        jwt:
          serviceAccountRef:
            name: {{ .Values.serviceAccount.name }}
            namespace: {{ .Values.serviceAccount.namespace }}
