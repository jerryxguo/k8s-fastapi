name: reusable-smoke-test

# A minimal post-deploy smoke test. Rather than reaching the Ingress from
# outside the cluster (which would need a runner with network access to the
# internal ALB), this runs the check *inside* the cluster via `kubectl run`,
# hitting the ClusterIP Service directly -- simpler, no extra infra, and
# just as meaningful a smoke test for a healthcheck-only example endpoint.

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string

permissions:
  id-token: write
  contents: read

concurrency:
  # Same group as reusable-deploy.yml so the two never overlap.
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      # As in reusable-deploy.yml. Duplicated rather than extracted: two
      # occurrences, and the variable lists differ.
      - name: Check this Environment is configured
        env:
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
          AWS_REGION_VAR: ${{ vars.AWS_REGION }}
          EKS_CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME }}
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          missing=""
          [ -n "${AWS_ROLE_ARN}" ]     || missing="${missing} AWS_ROLE_ARN"
          [ -n "${AWS_REGION_VAR}" ]   || missing="${missing} AWS_REGION"
          [ -n "${EKS_CLUSTER_NAME}" ] || missing="${missing} EKS_CLUSTER_NAME"
          if [ -n "${missing}" ]; then
            echo "::error::Missing variable(s) on the '${TARGET_ENVIRONMENT}' GitHub Environment:${missing}"
            exit 1
          fi

      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Update kubeconfig
        env:
          EKS_CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME }}
          AWS_REGION_VAR: ${{ vars.AWS_REGION }}
        run: aws eks update-kubeconfig --name "${EKS_CLUSTER_NAME}" --region "${AWS_REGION_VAR}"

      - name: Curl /healthcheck from inside the cluster
        run: |
          NS="${{ vars.APP_NAMESPACE || 'k8s-demo' }}"
          kubectl -n "$NS" run smoke-test-"${GITHUB_RUN_ID}" \
            --rm -i --restart=Never --image=curlimages/curl:8.10.1 -- \
            curl -sf --max-time 10 http://k8s-demo-service."$NS".svc.cluster.local/healthcheck
