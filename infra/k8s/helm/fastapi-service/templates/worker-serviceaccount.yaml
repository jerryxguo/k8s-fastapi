{{- if and .Values.worker.enabled .Values.worker.serviceAccount.create }}
# Separate from the API's ServiceAccount, which carries the API's IRSA role:
# the worker needs no AWS permissions, so it gets none.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "fastapi-service.worker.serviceAccountName" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "fastapi-service.worker.labels" . | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
